<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0A1128;
            color: #ffffff;
            line-height: 1.6;
        }
        
        header {
            background-color: #001F54;
            padding: 20px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
        }
        
        h1 {
            font-family: 'Comic Neue', cursive;
            font-size: 2.5rem;
            color: #1E90FF;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }
        
        nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        nav ul li {
            display: inline;
        }
        
        nav ul li a {
            color: #1E90FF;
            text-decoration: none;
            font-size: 1.2rem;
            transition: color 0.3s ease-in-out;
        }
        
        nav ul li a:hover {
            color: #00BFFF;
        }
        
        main {
            padding: 80px 20px 20px;
        }
        
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
            padding: 20px;
        }
        
        .card {
            background: #112D4E;
            padding: 20px;
            border-radius: 10px;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .card:hover {
            transform: scale(1.05);
            box-shadow: 0px 6px 15px rgba(0, 0, 0, 0.5);
        }
        
        footer {
            text-align: center;
            padding: 20px;
            background-color: #001F54;
            margin-top: 20px;
            box-shadow: 0px -4px 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <header>
        <h1>Vortex Project</h1>
        <nav>
            <ul>
                <li><a href="#noticias">Notícias</a></li>
                <li><a href="#reviews">Reviews</a></li>
                <li><a href="#guia">Guia Geral</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section id="noticias">
            <h2>Últimas Notícias</h2>
            <div class="grid-container">
                <article class="card">Notícia 1</article>
                <article class="card">Notícia 2</article>
                <article class="card">Notícia 3</article>
            </div>
        </section>
        
        <section id="reviews">
            <h2>Reviews</h2>
            <div class="grid-container">
                <article class="card">Review 1</article>
                <article class="card">Review 2</article>
                <article class="card">Review 3</article>
            </div>
        </section>
        
        <section id="guia">
            <h2>Guia Geral</h2>
            <p>Um guia completo sobre animes, lançamentos e curiosidades.</p>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2025 Vortex Project - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
